<script>// ===================================================================
// СТРОЙМЕХАНИЗАЦИЯ — лёгкая, ненавязчивая интерактивность
// ===================================================================

document.addEventListener('DOMContentLoaded', () => {

  // ---------- Тень хедера при прокрутке ----------
  const header = document.querySelector('.site-header');
  if (header) {
    // класс переключаем только при смене состояния — иначе браузер
    // пересчитывает стили на каждом событии прокрутки
    let scrolled = null;
    const onScroll = () => {
      const next = window.scrollY > 10;
      if (next === scrolled) return;
      scrolled = next;
      header.classList.toggle('scrolled', next);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  // ---------- Мобильное меню ----------
  const burger = document.querySelector('.burger');
  const mainNav = document.querySelector('.main-nav');
  if (burger && mainNav) {
    burger.addEventListener('click', () => {
      const isOpen = burger.classList.toggle('open');
      mainNav.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    mainNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        mainNav.classList.remove('open');
      });
    });
  }

  // ---------- Полоска контактов (звонок/WhatsApp/Telegram/почта) ----------
  const contactWidget = document.querySelector('.contact-widget');
  const contactTrigger = document.querySelector('.contact-trigger');
  if (contactWidget && contactTrigger) {
    contactTrigger.addEventListener('click', (e) => {
      // Первый тап на тач-устройстве раскрывает полоску, не переходя по tel:
      // Второй тап (когда уже открыта) звонит как обычно
      if (!contactWidget.classList.contains('open')) {
        e.preventDefault();
        contactWidget.classList.add('open');
      }
    });
    document.addEventListener('click', (e) => {
      if (!contactWidget.contains(e.target)) {
        contactWidget.classList.remove('open');
      }
    });
  }

  // ---------- Плавное появление блоков при скролле ----------
  const revealEls = document.querySelectorAll('.reveal');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if ('IntersectionObserver' in window && revealEls.length && !prefersReducedMotion) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('is-visible'));
  }

  // ---------- Счётчики статистики ----------
  const counters = document.querySelectorAll('.stat-num[data-count]');
  if (counters.length) {
    const animateCounter = (el) => {
      const target = parseFloat(el.dataset.count);
      const suffix = el.dataset.suffix || '';
      if (prefersReducedMotion) { el.textContent = target + suffix; return; }
      const duration = 1300;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target) + suffix;
        if (progress < 1) requestAnimationFrame(tick);
        else el.textContent = target + suffix;
      }
      requestAnimationFrame(tick);
    };
    const counterIO = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCounter(entry.target);
          counterIO.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(c => counterIO.observe(c));
  }

  // ---------- FAQ-аккордеон ----------
  document.querySelectorAll('.faq-question').forEach(q => {
    q.addEventListener('click', () => {
      const item = q.closest('.faq-item');
      const answer = item.querySelector('.faq-answer');
      const isOpen = item.classList.contains('open');

      document.querySelectorAll('.faq-item.open').forEach(openItem => {
        if (openItem !== item) {
          openItem.classList.remove('open');
          openItem.querySelector('.faq-answer').style.maxHeight = null;
        }
      });

      if (isOpen) {
        item.classList.remove('open');
        answer.style.maxHeight = null;
      } else {
        item.classList.add('open');
        answer.style.maxHeight = answer.scrollHeight + 'px';
      }
    });
  });

  // ---------- Фильтр парка техники ----------
  const craneCards = document.querySelectorAll('.crane-card[data-category]');
  const classTags = document.querySelectorAll('.filter-tag[data-filter]');
  const brandTags = document.querySelectorAll('.filter-tag[data-brand]');
  if (craneCards.length && (classTags.length || brandTags.length)) {
    let activeClass = 'all';
    let activeBrand = 'all';

    const applyFilters = () => {
      craneCards.forEach(card => {
        const okClass = activeClass === 'all' || card.dataset.category === activeClass;
        const okBrand = activeBrand === 'all' || card.dataset.brand === activeBrand;
        card.classList.toggle('hidden', !(okClass && okBrand));
      });
    };

    // повторное нажатие на выбранный фильтр снимает его
    classTags.forEach(tag => {
      tag.addEventListener('click', () => {
        const wasActive = tag.classList.contains('active');
        classTags.forEach(t => t.classList.remove('active'));
        if (!wasActive) tag.classList.add('active');
        activeClass = wasActive ? 'all' : tag.dataset.filter;
        tag.blur();
        applyFilters();
      });
    });

    brandTags.forEach(tag => {
      tag.addEventListener('click', () => {
        const wasActive = tag.classList.contains('active');
        brandTags.forEach(t => t.classList.remove('active'));
        if (!wasActive) tag.classList.add('active');
        activeBrand = wasActive ? 'all' : tag.dataset.brand;
        tag.blur();
        applyFilters();
      });
    });
  }

  // ---------- Форма обратной связи ----------
  // Отправка через Telegram-бот встроена прямо в zayavka.html.
  // Этот обработчик оставлен для других форм, если появятся.
  document.querySelectorAll('.js-contact-form:not(#requestForm)').forEach(form => {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const wrapper = form.closest('.contact-form') || form.parentElement;
      const success = wrapper.querySelector('.form-success');
      form.style.display = 'none';
      if (success) success.classList.add('show');
    });
  });


  // ---------- Поп-ап с описанием и ценой услуги ----------
  const sModal = document.getElementById('serviceModal');
  if (sModal) {
    const sTitle = sModal.querySelector('#smTitle');
    const sDesc  = sModal.querySelector('.service-modal-desc');
    const sPrice = sModal.querySelector('.service-modal-price b');
    let lastFocused = null;

    const openModal = (card) => {
      sTitle.textContent = card.dataset.title || '';
      sDesc.textContent  = card.dataset.desc  || '';
      sPrice.textContent = card.dataset.price || '';
      sModal.hidden = false;
      document.body.style.overflow = 'hidden';
      sModal.querySelector('.service-modal-close').focus();
    };
    const closeModal = () => {
      sModal.hidden = true;
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    };

    document.querySelectorAll('.service-more').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        lastFocused = btn;
        const card = btn.closest('.service-card');
        if (card) openModal(card);
      });
    });

    sModal.querySelectorAll('[data-close]').forEach(el => {
      el.addEventListener('click', closeModal);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !sModal.hidden) closeModal();
    });
  }


  // ---------- Уходящие карточки лент плавно уменьшаются ----------
  const rails = [
    { el: document.querySelector('.crane-rail'), axis: 'x' },
    { el: document.querySelector('.crane-grid'), axis: 'x' },
    { el: document.querySelector('.service-rail'), axis: 'y' },
    { el: document.querySelector('.review-rail'), axis: 'x' }
  ].filter(r => r.el);

  rails.forEach(({ el, axis }) => {
    const items = [...el.children];
    if (!items.length) return;

    // сначала читаем все размеры, потом пишем стили: если чередовать,
    // браузер пересчитывает раскладку на каждой карточке (layout thrashing)
    const update = () => {
      const box = el.getBoundingClientRect();
      const start = axis === 'x' ? box.left : box.top;
      const end   = axis === 'x' ? box.right : box.bottom;

      const next = items.map(item => {
        const r = item.getBoundingClientRect();
        const iStart = axis === 'x' ? r.left : r.top;
        const iEnd   = axis === 'x' ? r.right : r.bottom;
        const size   = axis === 'x' ? r.width : r.height;
        if (!size) return null;

        // какая доля карточки вышла за пределы ленты
        const hiddenBefore = Math.max(0, start - iStart);
        const hiddenAfter  = Math.max(0, iEnd - end);
        const hidden = Math.min(1, (hiddenBefore + hiddenAfter) / size);

        return {
          scale: (1 - hidden * 0.18).toFixed(3),
          opacity: (1 - hidden * 0.45).toFixed(3)
        };
      });

      next.forEach((v, i) => {
        if (!v) return;
        const item = items[i];
        if (item.style.getPropertyValue('--rail-scale') !== v.scale) item.style.setProperty('--rail-scale', v.scale);
        if (item.style.opacity !== v.opacity) item.style.opacity = v.opacity;
      });
    };

    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { update(); ticking = false; });
    };

    el.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    update();
  });


  // ---------- Карточки принципов: раскрытие по нажатию ----------
  document.querySelectorAll('.value-card').forEach(card => {
    card.addEventListener('click', () => {
      if (!window.matchMedia('(hover: none)').matches) return;
      const wasOpen = card.classList.contains('open');
      document.querySelectorAll('.value-card.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) card.classList.add('open');
    });
  });
  // нажатие вне карточки — закрываем раскрытую
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.value-card')) return;
    document.querySelectorAll('.value-card.open').forEach(c => c.classList.remove('open'));
  });

  // ---------- Телефон переезжает в меню на мобильных ----------
  const cWidget = document.querySelector('.contact-widget');
  const navEl = document.querySelector('.main-nav');
  const headerInner = document.querySelector('.header-inner');
  if (cWidget && navEl && headerInner) {
    const mq = window.matchMedia('(max-width: 980px)');
    const place = () => {
      if (mq.matches) {
        if (cWidget.parentElement !== navEl) navEl.appendChild(cWidget);
      } else if (cWidget.parentElement !== headerInner) {
        headerInner.insertBefore(cWidget, navEl);
      }
      cWidget.classList.remove('open');
    };
    place();
    mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place);
  }

  // ---------- Кнопка «Фильтры» ----------
  const fToggle = document.querySelector('.filters-toggle');
  const fGroup = document.querySelector('.filter-group');
  if (fToggle && fGroup) {
    fToggle.addEventListener('click', () => {
      const isOpen = fGroup.classList.toggle('open');
      fToggle.classList.toggle('open', isOpen);
      fToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }

});

  };

    tile.addEventListener('click', () => {

      desc.textContent = tile.dataset.desc || '';

      document.body.style.overflow = 'hidden';
      modal.querySelector('.service-modal-close').focus();
    });
  });
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(); });
});

// ---------- Выбор номера / почты при наведении на значок ----------
document.addEventListener('DOMContentLoaded', () => {
  const C = {
    phone: { title: 'Позвонить', items: [
      ['+7 (916) 804-28-24', 'tel:+79168042824'],
      ['+7 (929) 550-56-33', 'tel:+79295505633'],
      ['+7 (929) 550-56-31', 'tel:+79295505631'] ] },
    whatsapp: { title: 'WhatsApp', items: [
      ['+7 (916) 804-28-24', 'https://wa.me/79168042824'],
      ['+7 (929) 550-56-33', 'https://wa.me/79295505633'] ] },
    telegram: { title: 'Telegram', items: [
      ['+7 (916) 804-28-24', 'https://t.me/+79168042824'],
      ['+7 (929) 550-56-33', 'https://t.me/+79295505633'] ] },
    mail: { title: 'Почта', items: [
      ['stroimontage@mail.ru', 'mailto:stroimontage@mail.ru'],
      ['cranager@mail.ru', 'mailto:cranager@mail.ru'] ] }
  };
  const pop = document.createElement('div');
  pop.className = 'cpop'; pop.hidden = true; pop.setAttribute('role', 'menu');
  document.body.appendChild(pop);
  let owner = null, hideT = null;
  const hoverable = window.matchMedia('(hover: hover)').matches;

  const place = () => {
    if (!owner) return;
    // в шапке (она закреплена) — fixed, в остальных местах — привязка к странице
    const fixed = !!owner.closest('.site-header');
    pop.style.position = fixed ? 'fixed' : 'absolute';
    const r = owner.getBoundingClientRect();
    const pw = pop.offsetWidth;
    const cx = r.left + r.width / 2;
    let left = cx - pw / 2;
    left = Math.max(10, Math.min(left, document.documentElement.clientWidth - pw - 10));
    const top = r.bottom + 14;
    pop.style.left = left + (fixed ? 0 : window.scrollX) + 'px';
    pop.style.top = top + (fixed ? 0 : window.scrollY) + 'px';
    pop.style.setProperty('--arrow-x', (cx - left) + 'px');
    if (!fixed) {
      // если список упирается в конец страницы — добавляем места под подвалом
      const footer = document.querySelector('.site-footer');
      const over = (top + window.scrollY + pop.offsetHeight + 32) - document.documentElement.scrollHeight;
      if (footer && over > 0) footer.style.paddingBottom = (parseFloat(getComputedStyle(footer).paddingBottom) + over) + 'px';
    }
  };
  // пока открыт список, полоска значков в шапке не сворачивается
  let heldWidget = null;
  const hold = (a) => {
    const w = a.closest('.contact-widget');
    if (heldWidget && heldWidget !== w) heldWidget.classList.remove('open', 'held');
    heldWidget = w;
    if (w && !w.classList.contains('open')) w.classList.add('open', 'held');
  };
  const release = () => {
    if (heldWidget && heldWidget.classList.contains('held')) heldWidget.classList.remove('open', 'held');
    heldWidget = null;
  };
  const show = (a) => {
    clearTimeout(hideT);
    hold(a);
    const d = C[a.dataset.contacts]; if (!d) return;
    if (owner === a && !pop.hidden) return;
    owner = a;
    const ext = a.dataset.contacts === 'whatsapp' || a.dataset.contacts === 'telegram';
    pop.innerHTML = '<div class="cpop-title">' + d.title + '</div>' + d.items.map(([t, h]) =>
      '<a role="menuitem" href="' + h + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>').join('');
    pop.hidden = false; place();
  };
  const hide = () => { pop.hidden = true; owner = null; release(); };
  const hideSoon = () => { clearTimeout(hideT); hideT = setTimeout(hide, 220); };

  document.querySelectorAll('[data-contacts]').forEach(a => {
    if (hoverable) {
      a.addEventListener('mouseenter', () => show(a));
      a.addEventListener('mouseleave', hideSoon);
    }
    a.addEventListener('click', e => {
      // полоска в шапке сначала раскрывается — номер выбираем следующим нажатием
      const w = a.closest('.contact-widget');
      if (a.classList.contains('contact-trigger') && w && (!w.classList.contains('open') || w.classList.contains('held')) && !hoverable) return;
      e.preventDefault();
      if (owner === a && !pop.hidden) hide(); else show(a);
    });
  });
  pop.addEventListener('mouseenter', () => clearTimeout(hideT));
  pop.addEventListener('mouseleave', hideSoon);
  document.addEventListener('click', e => {
    if (!pop.hidden && !pop.contains(e.target) && !(owner && owner.contains(e.target))) hide();
  });
  window.addEventListener('resize', place);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
});

// ---------- Карта: офис и база техники ----------
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('crane-map');
  if (!el || !window.L) return;
  const points = [
    { n: 1, cls: 'pin-office', ll: [55.777109, 37.519622], title: 'Офис', addr: 'Москва, Хорошёвское шоссе, 35к2' },
    { n: 2, cls: 'pin-base',   ll: [55.906285, 37.329632], title: 'База техники', addr: 'г. о. Химки, мкр. Новогорск, ул. Ивановская, вл. 1' }
  ];
  // основная подложка — OpenStreetMap; если её сервер не ответит — Esri World Street Map
  const LAYERS = [
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'],
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', 'Карта &copy; Esri, OpenStreetMap']
  ];
  let map = null;
  const build = (i) => {
    if (map) { map.remove(); map = null; }
    map = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    const layer = L.tileLayer(LAYERS[i][0], { maxZoom: 19, attribution: LAYERS[i][1] });
    if (i + 1 < LAYERS.length) {
      let loaded = 0, failed = 0;
      layer.on('tileload', () => { loaded++; });
      layer.on('tileerror', () => { failed++; if (!loaded && failed === 3) setTimeout(() => { build(i + 1); el.dispatchEvent(new Event('map-rebuilt')); }, 0); });
    }
    layer.addTo(map);
    return map;
  };
  build(0);
  const addMarkers = () => points.map(p => {
    const icon = L.divIcon({ className: 'map-marker', html: '<span class="map-marker-pin ' + p.cls + '"><b>' + p.n + '</b></span>', iconSize: [40, 50], iconAnchor: [20, 48], popupAnchor: [0, -44] });
    const route = 'https://yandex.ru/maps/?rtext=~' + p.ll[0] + ',' + p.ll[1] + '&rtt=auto';
    return L.marker(p.ll, { icon, title: p.title }).addTo(map)
      .bindPopup('<b>' + p.title + '</b><br>' + p.addr + '<br><a href="' + route + '" target="_blank" rel="noopener">Построить маршрут →</a>');
  });
  const finish = () => {
    const markers = addMarkers();
    map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [50, 50] });
    // колесо мыши включаем только после клика по карте, чтобы страница не «застревала»
    map.on('click', () => map.scrollWheelZoom.enable());
  };
  finish();
  window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
  el.addEventListener('mouseleave', () => { if (map) map.scrollWheelZoom.disable(); });
  // при переключении на запасную подложку заново ставим метки
  el.addEventListener('map-rebuilt', finish);
});

// ---------- Маска телефона: +7 (XXX) XXX-XX-XX, только цифры ----------
document.addEventListener('DOMContentLoaded', () => {
  const fmt = (d) => {
    // d — до 10 цифр номера без кода страны
    let out = '+7 (' + d.slice(0, 3);
    if (d.length >= 3) out += ') ' + d.slice(3, 6);
    if (d.length >= 6) out += '-' + d.slice(6, 8);
    if (d.length >= 8) out += '-' + d.slice(8, 10);
    return out;
  };
  const digitsOf = (v) => {
    let d = v.replace(/\D/g, '');
    if (d.startsWith('7') || d.startsWith('8')) d = d.slice(1);   // код страны пишем сами
    return d.slice(0, 10);
  };
  document.querySelectorAll('input[type="tel"]').forEach(inp => {
    let prev = '';
    const apply = (d) => { inp.value = d.length ? fmt(d) : '+7 ('; prev = d; inp.setSelectionRange(inp.value.length, inp.value.length); };
    inp.addEventListener('focus', () => { if (!inp.value) apply(''); });
    inp.addEventListener('blur', () => { if (!digitsOf(inp.value).length) inp.value = ''; });
    inp.addEventListener('keydown', e => {
      // Backspace всегда удаляет последнюю цифру, а не скобку или дефис
      if (e.key === 'Backspace') { e.preventDefault(); apply(digitsOf(inp.value).slice(0, -1)); }
    });
    inp.addEventListener('input', () => {
      let d = inp.value.replace(/\D/g, '');
      // вставка полного номера (+7..., 8..., 7...) или ввод по одной цифре
      if (d.length > 10 && (d[0] === '7' || d[0] === '8')) d = d.slice(1);
      else if (inp.value.startsWith('+7')) d = d.slice(1);
      apply(d.slice(0, 10));
    });
    inp.addEventListener('paste', e => {
      e.preventDefault();
      apply(digitsOf((e.clipboardData || window.clipboardData).getData('text')));
    });
  });
});
