<style>/* =================================================================
   СТРОЙМЕХАНИЗАЦИЯ — сайт аренды пневмоколёсных кранов
   Дизайн: воздушный, песочный, скруглённые формы, мягкая анимация
   Палитра названа по смыслу: песок / крем / стрела (оранж) / крюк (жёлтый) / бронза (текст)
   v2: увеличены все отступы (padding/gap/margin) по фидбеку — сайт «дышит»
   ================================================================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; background: none; }
ul { list-style: none; }
input, textarea { font: inherit; }
section { position: relative; }

:root {
  /* ---- Цвета ---- */
  --cream: #FBF5EA;
  --cream-soft: #F6ECD8;
  --sand-light: #F0DFBC;
  --sand: #E7CB9A;
  --sand-dark: #D6AE73;
  --tan: #C68A4E;
  --brown: #8A5A34;
  --brown-dark: #6B4426;
  --brown-darker: #3E2814;
  --orange: #E8823A;
  --orange-dark: #CC6A26;
  --yellow: #F4B942;
  --yellow-soft: #FBDA9C;
  --white: #FFFFFF;
  --ink: #4A3625;
  --ink-light: #8A7860;
  --placeholder-bg: #DDD6C8;
  --placeholder-bg2: #E6E0D3;
  --placeholder-icon: #9C9083;
  --placeholder-text: #7A6F5F;

  /* ---- Радиусы (много скруглений) ---- */
  --radius-sm: 16px;
  --radius-md: 24px;
  --radius-lg: 36px;
  --radius-xl: 56px;
  --radius-full: 999px;

  /* ---- Отступы: единая шкала, применяется системно ---- */
  --sp-2xs: 10px;
  --sp-xs: 16px;
  --sp-sm: 22px;
  --sp-md: 32px;
  --sp-lg: 44px;
  --sp-xl: 64px;
  --sp-2xl: 88px;
  --sp-3xl: 120px;
  --sp-4xl: 150px;

  /* ---- Тени ---- */
  --shadow-soft: 0 24px 50px -18px rgba(62, 40, 20, 0.28);
  --shadow-card: 0 14px 32px -12px rgba(62, 40, 20, 0.16);
  --shadow-btn: 0 14px 26px -8px rgba(232, 130, 58, 0.55);

  /* ---- Шрифты ---- */
  --font-heading: 'Comfortaa', sans-serif;
  --font-body: 'Rubik', sans-serif;

  --container-w: 1200px;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.7;
  overflow-x: hidden;
  font-size: 16px;
}

h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-weight: 700;
  color: var(--brown-darker);
  line-height: 1.3;
}
h1 { font-size: clamp(38px, 5.4vw, 64px); }
h2 { font-size: clamp(32px, 4.3vw, 52px); }
h3 { font-size: clamp(21px, 2.5vw, 28px); }
p { color: var(--ink-light); }
strong { color: var(--brown-darker); }

:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
  border-radius: 8px;
}

.container { max-width: var(--container-w); margin-inline: auto; padding-inline: 32px; }

.section { padding-block: var(--sp-xl); }
.section-sm { padding-block: var(--sp-xl); }
@media (max-width: 720px) { .section { padding-block: var(--sp-2xl); } .container{ padding-inline:24px; } }

.section-alt { background: var(--cream-soft); }

.section-header { max-width: 680px; margin: 0 auto var(--sp-md); text-align: center; }
.section-header.left { margin-inline: 0; text-align: left; }
.section-header p { margin-top: 20px; font-size: 17.5px; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--sand-light);
  color: var(--brown-dark);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 11px 24px;
  border-radius: var(--radius-full);
  margin-bottom: 26px;
}
.eyebrow svg { width: 14px; height: 14px; }

/* =========================== Кнопки =========================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 40px;
  border-radius: var(--radius-full);
  font-weight: 700;
  font-size: 15.5px;
  border: none;
  transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color: var(--white);
  box-shadow: var(--shadow-btn);
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 32px -8px rgba(232,130,58,.65); }
.btn-secondary {
  background: var(--white);
  color: var(--brown-dark);
  border: 2px solid var(--sand);
}
.btn-secondary:hover { background: var(--sand-light); transform: translateY(-3px); }
.btn-outline-light { background: transparent; color: var(--white); border: 2px solid rgba(255,255,255,.55); }
.btn-outline-light:hover { background: rgba(255,255,255,.14); transform: translateY(-3px); }
.btn-block { width: 100%; }
.btn-sm { padding: 14px 26px; font-size: 14px; }

/* =========================== Хедер =========================== */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgb(233, 220, 196);
  transition: box-shadow .3s ease;
}
.site-header.scrolled { box-shadow: 0 8px 30px -14px rgba(62,40,20,.3); }
.header-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 9px; gap: 26px; }
.logo { display: flex; align-items: center; gap: 12px; font-family: var(--font-heading); font-weight: 700; font-size: 20px; color: var(--brown-darker); flex-shrink: 0; }
.logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--yellow), var(--orange)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--white); flex-shrink: 0; }
.logo-icon svg { width: 22px; height: 22px; }

.main-nav { display: flex; align-items: center; gap: 26px; }
.main-nav a { font-weight: 600; font-size: 14.5px; color: var(--ink); position: relative; padding-block: 8px; transition: color .25s ease; white-space: nowrap; }
.main-nav a::after { content: ''; position: absolute; left: 0; bottom: 8px; height: 2px; width: 0; background: var(--orange); transition: width .25s ease; border-radius: 2px; }
.main-nav a:hover, .main-nav a.active { color: var(--orange-dark); }
.main-nav a:hover::after, .main-nav a.active::after { width: 100%; }

.header-actions { display: flex; align-items: center; gap: 14px; }
.contact-widget { position: relative; margin-left: auto; display: flex; align-items: center; }
.contact-trigger, .contact-dropdown-item {
  width: 40px; height: 40px; flex-shrink: 0;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  transition: background .25s ease, transform .38s cubic-bezier(.34, 1.3, .48, 1);
  backface-visibility: hidden;
}
.contact-trigger { background: var(--sand-light); position: relative; z-index: 2; }
.contact-trigger:hover { background: var(--sand); }
.contact-dropdown-item { background: transparent; }
.contact-dropdown-item:hover { transform: scale(1.14); }
.contact-trigger img, .contact-dropdown-item img { width: 22px; height: 22px; object-fit: contain; }
.contact-dropdown-item.is-whatsapp img { width: 28px; height: 28px; }

.contact-dropdown {
  position: absolute; top: 20px; right: 0;
  width: 40px;
  z-index: 1;
  max-height: 0; overflow: hidden;
  opacity: 0; pointer-events: none;
  transition: max-height .34s ease, opacity .2s ease;
}
.contact-dropdown-inner {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: rgba(255, 255, 255, .62);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 26px 0 6px;
  border-radius: 0 0 var(--radius-full) var(--radius-full);
  box-shadow: var(--shadow-card);
}
.contact-widget:hover .contact-dropdown,
.contact-widget:focus-within .contact-dropdown,
.contact-widget.open .contact-dropdown {
  max-height: 300px; opacity: 1; pointer-events: auto;
}
.burger { display: none; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--sand-light); border: none; align-items: center; justify-content: center; flex-direction: column; gap: 5px; flex-shrink: 0; }
.burger span { display: block; width: 20px; height: 2px; background: var(--brown-dark); border-radius: 2px; transition: transform .3s ease, opacity .3s ease; }
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 980px) {
  .main-nav { display: flex; position: fixed; top: 68px; left: 16px; right: 16px; background: var(--white); border-radius: var(--radius-lg); flex-direction: column; align-items: flex-start; gap: 6px; box-shadow: var(--shadow-soft); max-height: 0; overflow: hidden; opacity: 0; pointer-events: none; transition: max-height .35s ease, opacity .25s ease, padding .35s ease; padding: 0 28px; }
  .main-nav.open { max-height: 520px; opacity: 1; pointer-events: auto; padding: 28px; }
  .main-nav a { width: 100%; padding: 13px 0; }
  .burger { display: flex; }
}

/* =========================== Герой =========================== */
.hero { padding-top: var(--sp-xs); padding-bottom: 38px; overflow: visible; }

.hero-visual {
  position: relative;
  display: flex;
  align-items: flex-start;
  min-height: clamp(520px, 56vw, 660px);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.hero-visual .photo-placeholder {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border-radius: 0; border: none;
  align-items: flex-end; justify-content: flex-end;
  padding: 36px 44px;
  z-index: 0;
}
.hero-visual::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(251,245,234,.55) 0%, rgba(251,245,234,.34) 40%, rgba(251,245,234,.62) 76%, var(--cream) 100%);
  z-index: 1;
  pointer-events: none;
}
.hero-text { position: relative; z-index: 2; max-width: 600px; padding: 40px 56px 64px; }
.hero-text h1 { text-transform: uppercase; letter-spacing: 0.01em; }
.hero-text p { font-size: 18px; margin-block: 28px 42px; max-width: 480px; color: var(--ink); }
.hero-actions { display: flex; gap: 18px; flex-wrap: nowrap; }

@media (max-width: 900px) {
  .hero-visual { min-height: clamp(460px, 92vw, 560px); }
  .hero-text { padding: 40px 28px 112px; max-width: none; }
  .hero-text p { max-width: none; }
  .hero-visual .photo-placeholder { padding: 22px 26px; }
  .hero-actions { gap: 10px; }
  .hero-actions .btn { padding: 15px 20px; font-size: 13.5px; }
}
@media (max-width: 359px) {
  .hero-text { padding-inline: 20px; }
  .hero-actions { gap: 6px; }
  .hero-actions .btn { padding: 14px 14px; font-size: 12.5px; }
}

/* =========================== Блобы (декор) =========================== */
.blob { position: absolute; border-radius: 50%; opacity: .5; z-index: -1; animation: float 10s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }

/* =========================== Статистика =========================== */
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; background: var(--white); border-radius: var(--radius-lg); padding: 52px 40px; box-shadow: var(--shadow-card); position: relative; z-index: 2; margin-top: 56px; margin-bottom: 0; }
.stat-item { text-align: center; position: relative; }
/* Вертикальные разделители между показателями */
.stat-item + .stat-item::before {
  content: '';
  position: absolute;
  left: -14px; top: 50%;
  transform: translateY(-50%);
  width: 1px; height: 72%;
  background: rgba(138, 90, 52, .3);
}
.stat-num { display: block; font-family: var(--font-heading); font-weight: 700; font-size: clamp(34px, 4.2vw, 52px); background: linear-gradient(135deg, var(--orange-dark), var(--yellow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat-label { font-size: 16px; font-weight: 600; color: var(--ink-light); margin-top: 12px; display: block; }
@media (max-width: 720px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); margin-top: 36px; margin-bottom: 0; gap: 32px 20px; padding: 40px 28px; }
  .stat-item + .stat-item::before { display: none; }
  .stat-item:nth-child(even)::before { display: block; left: -10px; }
}

/* =========================== Сетки =========================== */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 36px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }
@media (max-width: 980px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-6 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 620px) { .grid-3, .grid-4, .grid-2, .grid-6 { grid-template-columns: 1fr; } }

.card { background: var(--white); border-radius: var(--radius-lg); padding: 42px 38px; box-shadow: var(--shadow-card); transition: transform .35s ease, box-shadow .35s ease; }
.card:hover { transform: translateY(-8px); box-shadow: var(--shadow-soft); }

.icon-badge { width: 58px; height: 58px; border-radius: var(--radius-md); background: var(--sand-light); display: flex; align-items: center; justify-content: center; color: var(--orange-dark); margin-bottom: 24px; flex-shrink: 0; }
.icon-badge svg { width: 27px; height: 27px; }

.service-card h3 { margin-bottom: 14px; }
.service-card p { font-size: 15px; }

/* =========================== Плейсхолдер фото =========================== */
.photo-placeholder {
  background: repeating-linear-gradient(135deg, var(--placeholder-bg), var(--placeholder-bg) 12px, var(--placeholder-bg2) 12px, var(--placeholder-bg2) 24px);
  border-radius: var(--radius-lg);
  border: 2px dashed rgba(62,40,20,.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 32px; text-align: center; color: var(--placeholder-icon);
  width: 100%; height: 100%; min-height: 190px;
}
.photo-placeholder svg { width: 38px; height: 38px; opacity: .65; flex-shrink: 0; }
.photo-placeholder span { font-size: 13px; font-weight: 700; max-width: 260px; color: var(--placeholder-text); line-height: 1.6; }
.photo-placeholder.small { min-height: 104px; padding: 16px; }
.photo-placeholder.small svg { width: 28px; height: 28px; }
.photo-placeholder.small span { font-size: 12px; max-width: 200px; }

/* =========================== Карточки кранов =========================== */
.crane-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); transition: transform .35s ease, box-shadow .35s ease, opacity .3s ease; }
.crane-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-soft); }
.crane-card.hidden { display: none; }
.crane-card .photo-placeholder { border-radius: 0; aspect-ratio: 16/10; border: none; }
.crane-card-body { padding: 22px 24px 26px; }
.crane-card-body h3 { margin-bottom: 6px; }
.crane-tag { display: inline-block; background: var(--yellow-soft); color: var(--brown-dark); font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: var(--radius-full); margin-bottom: 20px; }
.crane-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-block: 22px; padding-block: 22px; border-block: 1px solid var(--sand-light); }
.crane-specs div span { font-size: 12.5px; color: var(--ink-light); display: block; margin-bottom: 2px; }
.crane-specs div b { display: block; color: var(--brown-darker); font-size: 15px; font-family: var(--font-heading); }
.crane-price { font-family: var(--font-heading); font-weight: 700; font-size: 19px; color: var(--orange-dark); margin-bottom: 22px; }

/* =========================== Почему мы =========================== */
.why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px 40px; }
.why-item { display: flex; gap: 20px; align-items: flex-start; }
.why-item .icon-badge { margin-bottom: 0; }
.why-item h3 { font-size: 17.5px; margin-bottom: 9px; }
.why-item p { font-size: 14.5px; }
@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; gap: 32px; } }

/* =========================== Шаги =========================== */
.steps-wrap { position: relative; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; position: relative; align-items: start; z-index: 1; }
.step-item { text-align: center; position: relative; }
.step-num { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--white); font-family: var(--font-heading); font-weight: 700; font-size: 23px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: var(--shadow-btn); position: relative; z-index: 2; }
.step-item h3 { font-size: 16.5px; margin-bottom: 11px; }
.step-item p { font-size: 13.5px; }
.steps-path { position: absolute; top: 0; left: 0; width: 100%; height: 260px; z-index: 0; pointer-events: none; }
.step-icon { width: 34px; height: 34px; margin: 0 auto 10px; color: var(--orange-dark); }
.step-icon svg { width: 100%; height: 100%; }
/* разброс кружков по вертикали, как на образце */
.step-off-1 { margin-top: 30px; }
.step-off-2 { margin-top: 110px; }
.step-off-3 { margin-top: 30px; }
.step-off-4 { margin-top: 110px; }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr 1fr; gap: 40px 24px; } .steps-path { display: none; } .step-off-1, .step-off-2, .step-off-3, .step-off-4 { margin-top: 0; } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

/* =========================== CTA баннер =========================== */
.cta-banner { background: linear-gradient(135deg, #8A5A34, #6B4426); margin-top: var(--sp-lg); border-radius: var(--radius-xl); padding: 56px 56px; text-align: center; color: var(--white); position: relative; overflow: hidden; }
.cta-banner h2 { color: var(--white); position: relative; z-index: 2; }
.cta-banner p { color: var(--yellow-soft); margin-block: 16px 28px; font-size: 15px; position: relative; z-index: 2; }
.cta-actions { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 2; }
.cta-phone { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: var(--white); margin-bottom: 8px; display: block; position: relative; z-index: 2; }
@media (max-width: 620px) { .cta-banner { padding: 56px 30px; } }

/* =========================== Статьи =========================== */
.article-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); transition: transform .35s ease, box-shadow .35s ease; position: relative; }
.article-card.is-link:hover { transform: translateY(-8px); box-shadow: var(--shadow-soft); }
.article-card .photo-placeholder { border-radius: 0; aspect-ratio: 16/10; border: none; }
.article-card-body { padding: 34px 34px 38px; }
.article-card-body h3 { margin-bottom: 14px; }
.article-tag { display: inline-block; background: var(--sand-light); color: var(--brown-dark); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 6px 15px; border-radius: var(--radius-full); margin-bottom: 18px; }
.article-meta { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-light); margin-top: 18px; }
.badge-soon { position: absolute; top: 20px; right: 20px; background: var(--brown-darker); color: var(--white); font-size: 11.5px; font-weight: 700; padding: 7px 16px; border-radius: var(--radius-full); z-index: 2; }
.read-link { display: inline-flex; align-items: center; gap: 6px; color: var(--orange-dark); font-weight: 700; font-size: 14px; margin-top: 8px; transition: gap .25s ease; }
.article-card.is-link:hover .read-link { gap: 10px; }
.read-link svg { width: 16px; height: 16px; }

/* =========================== FAQ =========================== */
.faq-item { background: var(--white); border-radius: var(--radius-md); margin-bottom: 18px; overflow: hidden; box-shadow: var(--shadow-card); }
.faq-question { display: flex; align-items: center; justify-content: space-between; padding: 26px 32px; font-weight: 700; font-size: 15.5px; color: var(--brown-darker); gap: 24px; width: 100%; text-align: left; border: none; }
.faq-question svg { flex-shrink: 0; transition: transform .3s ease; color: var(--orange); width: 20px; height: 20px; }
.faq-item.open .faq-question svg { transform: rotate(180deg); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.faq-answer p { padding: 0 32px 28px; font-size: 14.5px; }

/* =========================== Таблица цен =========================== */
.pricing-table { width: 100%; border-collapse: separate; border-spacing: 0 16px; }
.pricing-table th { text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-light); padding-inline: 32px; padding-bottom: 8px; }
.pricing-table td { background: var(--white); padding: 26px 32px; font-weight: 600; font-size: 15px; }
.pricing-table tr td:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); font-family: var(--font-heading); font-weight: 700; color: var(--brown-darker); }
.pricing-table tr td:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.price-highlight { color: var(--orange-dark); font-weight: 700; font-size: 16px; }
@media (max-width: 720px) {
  .pricing-table thead { display: none; }
  .pricing-table, .pricing-table tbody, .pricing-table tr, .pricing-table td { display: block; width: 100%; }
  .pricing-table tr { background: var(--white); border-radius: var(--radius-md); margin-bottom: 16px; padding: 22px 26px; box-shadow: var(--shadow-card); }
  .pricing-table td { padding: 7px 0; background: transparent !important; border-radius: 0 !important; }
}

/* =========================== Форма =========================== */
.contact-form { background: var(--white); border-radius: var(--radius-lg); padding: 48px; box-shadow: var(--shadow-card); }
.form-group { margin-bottom: 24px; }
.form-group label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 10px; color: var(--brown-dark); }
.form-group input, .form-group textarea { width: 100%; padding: 17px 22px; border-radius: var(--radius-md); border: 2px solid var(--sand-light); background: var(--cream-soft); transition: border-color .25s ease, background .25s ease; color: var(--ink); }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--orange); background: var(--white); }
.form-group textarea { resize: vertical; min-height: 110px; }
.form-note { font-size: 12.5px; color: var(--ink-light); margin-top: 8px; }
.form-success { display: none; text-align: center; padding: 30px 10px; }
.form-success.show { display: block; }
.form-success .icon-badge { margin-inline: auto; background: var(--yellow-soft); }

/* =========================== Подвал =========================== */
.site-footer { background: var(--brown-darker); color: var(--yellow-soft); padding-block: 34px 18px; margin-top: 0; }
.footer-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1.2fr; gap: 50px; margin-bottom: 60px; }
.footer-col h4 { color: var(--white); font-size: 15.5px; margin-bottom: 22px; }
.footer-col p { color: #D9C6AE; font-size: 14px; }
.footer-col a { color: #D9C6AE; font-size: 14px; }
.footer-col ul li { margin-bottom: 7px; }
.footer-col a:hover { color: var(--yellow); }
.footer-logo { display: flex; align-items: center; gap: 12px; font-family: var(--font-heading); font-weight: 700; font-size: 19px; color: var(--white); margin-bottom: 20px; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.12); padding-top: 30px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #B39D80; }
.social-row { display: flex; gap: 12px; margin-top: 20px; }
.social-row a { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; transition: background .25s ease, transform .25s ease; }
.social-row a:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
.social-row img { width: 27px; height: 27px; object-fit: contain; }
.social-row a[aria-label="WhatsApp"] img { width: 33px; height: 33px; }
/* Оранжевые контурные иконки тусклы на тёмном фоне — осветляем */
.social-row a[aria-label="Email"] img,
.social-row a[aria-label="Телефон"] img { filter: brightness(1.5) saturate(1.15); }
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; } }
@media (max-width: 560px) { .footer-grid { grid-template-columns: 1fr; } .footer-bottom { flex-direction: column; } }

/* =========================== Хлебные крошки =========================== */
.breadcrumbs { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-light); margin-bottom: 30px; flex-wrap: wrap; }
.breadcrumbs a:hover { color: var(--orange-dark); }

/* =========================== Тело статьи =========================== */
.article-layout { max-width: 800px; margin: 0 auto; }
.article-cover { margin-bottom: 48px; }
.article-cover .photo-placeholder { aspect-ratio: 16/8; }
.article-body h2 { margin-top: 58px; margin-bottom: 22px; }
.article-body p { margin-bottom: 22px; font-size: 16px; }
.article-body ul { margin: 20px 0 32px; }
.article-body ul li { position: relative; padding-left: 30px; margin-bottom: 14px; font-size: 15.5px; color: var(--ink-light); }
.article-body ul li::before { content: ''; position: absolute; left: 0; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--yellow), var(--orange)); }
.article-inline-photo { margin-block: 36px; }
.article-inline-photo .photo-placeholder { aspect-ratio: 16/9; }
.class-table { width: 100%; border-collapse: collapse; margin: 26px 0 32px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
.class-table th, .class-table td { padding: 18px 22px; text-align: left; font-size: 14px; }
.class-table th { background: var(--brown-dark); color: var(--white); font-weight: 700; }
.class-table tr:nth-child(even) td { background: var(--cream-soft); }
.class-table tr:nth-child(odd) td { background: var(--white); }
.article-share { display: flex; gap: 14px; align-items: center; margin-top: 52px; padding-top: 36px; border-top: 1px solid var(--sand-light); }

/* =========================== Анимация появления =========================== */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1.is-visible { transition-delay: .08s; }
.reveal-delay-2.is-visible { transition-delay: .16s; }
.reveal-delay-3.is-visible { transition-delay: .24s; }
.reveal-delay-4.is-visible { transition-delay: .32s; }
.reveal-delay-5.is-visible { transition-delay: .4s; }
.reveal-delay-6.is-visible { transition-delay: .48s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; }
}

/* =========================== Фильтр парка техники =========================== */
.filter-tags { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: -18px; margin-bottom: 28px; }
.filter-tag { padding: 14px 28px; border-radius: var(--radius-full); background: var(--white); border: 2px solid var(--sand-light); font-weight: 700; font-size: 14px; color: var(--brown-dark); transition: background .25s ease, border-color .25s ease, color .25s ease; }
.filter-tag.active, .filter-tag:hover { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--white); border-color: transparent; }

/* =========================== Внутренний герой страниц =========================== */
.page-hero { padding-block: 44px 40px; text-align: center; position: relative; overflow: hidden; }
.page-hero p { max-width: 600px; margin: 22px auto 0; font-size: 16.5px; }

/* =========================== Карта =========================== */
.map-placeholder { aspect-ratio: 16/6.5; }

/* =========================== Две колонки =========================== */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 76px; align-items: center; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; gap: 40px; } }
.split.rev .split-media { order: 2; }
@media (max-width: 900px) { .split.rev .split-media { order: -1; } }

/* =========================== Отзывы =========================== */
.review-card { display: flex; gap: 18px; }
.review-card .stars { color: var(--yellow); margin-bottom: 10px; display: flex; gap: 3px; }
.review-card .stars svg { width: 15px; height: 15px; }
.review-name { font-weight: 700; color: var(--brown-darker); font-size: 15px; }
.review-role { font-size: 12.5px; color: var(--ink-light); margin-bottom: 13px; }
.review-card p { font-size: 14.5px; }
.avatar-circle { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 700; color: var(--white); flex-shrink: 0; font-size: 15px; }

/* =========================== Ценности (о компании) =========================== */
.value-card { text-align: center; }
.value-card .icon-badge { margin-inline: auto; }

/* =========================== Утилиты =========================== */
.text-center { text-align: center; }
.mt-40 { margin-top: 56px; }
.mt-60 { margin-top: 76px; }
.tag-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.mini-tag { background: var(--cream-soft); color: var(--brown-dark); font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: var(--radius-full); }
.checklist li { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 17px; font-size: 15px; color: var(--ink); }
.checklist li svg { width: 20px; height: 20px; color: var(--orange); flex-shrink: 0; margin-top: 1px; }


/* =================== Заголовки-плашки =================== */
.pill-title {
  display: inline-flex;
  align-items: center;
  background: var(--sand-light);
  color: var(--brown-dark);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: .04em;
  text-transform: uppercase;
  line-height: 1.35;
  padding: 15px 34px;
  border-radius: var(--radius-full);
  margin: 0;
}
.section-header .pill-title + p { margin-top: 20px; }

/* =================== Лента автокранов =================== */
.crane-rail {
  display: flex;
  gap: 28px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 4px 22px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--sand-dark) transparent;
}
.crane-rail > .crane-card {
  flex: 0 0 clamp(260px, 30%, 350px);
  scroll-snap-align: start;
}
.crane-rail::-webkit-scrollbar { height: 8px; }
.crane-rail::-webkit-scrollbar-track { background: var(--sand-light); border-radius: var(--radius-full); }
.crane-rail::-webkit-scrollbar-thumb { background: var(--sand-dark); border-radius: var(--radius-full); }
.crane-rail::-webkit-scrollbar-thumb:hover { background: var(--tan); }
/* карточки тянутся на равную высоту — фиксируем пропорции фото (и в сетке, и в ленте) */
.crane-card { display: flex; flex-direction: column; }
.crane-card .photo-placeholder { height: auto; flex: none; }
.crane-card .crane-card-body { flex: 1; }
/* в ленте карточка не приподнимается — иначе дёргает прокрутку */
.crane-rail > .crane-card:hover { transform: none; box-shadow: var(--shadow-soft); }

/* =================== Центрированный футер =================== */
.footer-grid.footer-centered {
  grid-template-columns: minmax(0, 420px) minmax(0, 220px);
  justify-content: center;
  gap: 72px;
  text-align: left;
}
.footer-grid.footer-centered .social-row { justify-content: flex-start; }
@media (max-width: 720px) {
  .footer-grid.footer-centered { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 44px; }
  .footer-grid.footer-centered .social-row { justify-content: center; }
  .footer-grid.footer-centered .footer-logo { justify-content: center; }
}

/* =================== Страница заявки =================== */
.request-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: start; }
.request-side { padding-top: 8px; }
.request-contacts { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--sand); display: flex; flex-direction: column; gap: 6px; }
.request-phone { font-family: var(--font-heading); font-weight: 700; font-size: 26px; color: var(--brown-darker); }
.request-contacts span { font-size: 15px; color: var(--ink-light); }
@media (max-width: 860px) { .request-layout { grid-template-columns: 1fr; gap: 44px; } }


/* ============ B. Длинные слова не распирают колонки сетки ============ */
.grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-6 > *, .why-grid > * { min-width: 0; }
.card h3, .value-card h3, .why-item h3, .service-card h3 { overflow-wrap: break-word; }
@media (max-width: 1150px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
/* заголовки карточек в узких колонках — умереннее, иначе слова рвутся */
.value-card h3 { font-size: clamp(18px, 1.6vw, 22px); }

/* ============ A. Исключение: вводный заголовок «О компании» ============ */
.intro-title { font-size: clamp(26px, 2.9vw, 34px); }

/* ============ E. Телефон выше кнопок в CTA-блоках ============ */
.cta-banner .cta-phone { margin-bottom: 38px; }


/* ============ 7) Заголовок в CTA — компактнее ============ */
.cta-banner h2 { font-size: clamp(26px, 3vw, 38px); }
.cta-banner .cta-phone { font-size: 19px; margin-bottom: 26px; }

/* ============ 4) Карточки кранов увеличиваются при наведении ============ */
.crane-card { transition: transform .35s cubic-bezier(.34, 1.16, .5, 1), box-shadow .35s ease; }
.crane-card:hover { transform: scale(1.035); box-shadow: var(--shadow-soft); z-index: 3; }
.crane-rail > .crane-card:hover { transform: scale(1.035); box-shadow: var(--shadow-soft); }

/* ============ 6) Отзывы — горизонтальная лента ============ */
.review-rail {
  display: flex;
  gap: 28px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 4px 22px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--sand-dark) transparent;
}
.review-rail > * { flex: 0 0 clamp(280px, 32%, 380px); scroll-snap-align: start; }
.review-rail::-webkit-scrollbar { height: 8px; }
.review-rail::-webkit-scrollbar-track { background: var(--sand-light); border-radius: var(--radius-full); }
.review-rail::-webkit-scrollbar-thumb { background: var(--sand-dark); border-radius: var(--radius-full); }
.review-rail::-webkit-scrollbar-thumb:hover { background: var(--tan); }

/* ============ 9) Одинаковые отступы: убираем разнобой ============ */



/* ====== Карточки принципов: заголовок + крупный значок, описание по наведению ====== */
.value-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: transform .35s cubic-bezier(.34,1.16,.5,1), box-shadow .35s ease;
}
.value-card .icon-badge {
  width: 84px; height: 84px;
  margin: 0 auto 18px;
  transition: transform .35s ease;
}
.value-card .icon-badge svg { width: 40px; height: 40px; }
.value-card h3 { margin-bottom: 0; transition: margin-bottom .3s ease; }
.value-card p {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height .4s ease, opacity .3s ease, margin-top .3s ease;
  margin-top: 0;
}
.value-card:hover, .value-card:focus-within {
  transform: translateY(-4px);
  box-shadow: var(--shadow-soft);
}
.value-card:hover p, .value-card:focus-within p {
  max-height: 220px;
  opacity: 1;
  margin-top: 14px;
}
.value-card:hover .icon-badge, .value-card:focus-within .icon-badge { transform: scale(1.06); }
/* на тач-устройствах наведения нет — показываем описание сразу */
@media (hover: none) {
  .value-card p { max-height: none; opacity: 1; margin-top: 14px; }
}


/* ============ Стрелка в карточке услуги ============ */
.service-card { position: relative; }
.service-more {
  position: absolute; top: 22px; right: 22px;
  width: 42px; height: 42px;
  border: none; border-radius: var(--radius-full);
  background: var(--sand-light); color: var(--brown-dark);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .25s ease, transform .3s cubic-bezier(.34,1.2,.5,1), color .25s ease;
}
.service-more svg { width: 18px; height: 18px; }
.service-more:hover { background: var(--orange); color: var(--white); transform: translateX(3px); }
.service-card h3 { padding-right: 52px; }

/* ============ Поп-ап услуги ============ */
.service-modal { position: fixed; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center; padding: 24px; }
.service-modal[hidden] { display: none; }
.service-modal-backdrop { position: absolute; inset: 0; background: rgba(62, 40, 20, .55); backdrop-filter: blur(3px); animation: smFade .25s ease; }
.service-modal-box {
  position: relative; z-index: 1;
  width: min(520px, 100%);
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 44px 40px 36px;
  box-shadow: var(--shadow-soft);
  animation: smPop .3s cubic-bezier(.34,1.2,.5,1);
}
.service-modal-box h3 { margin-bottom: 14px; padding-right: 40px; }
.service-modal-desc { color: var(--ink-light); margin-bottom: 24px; }
.service-modal-price {
  background: var(--cream-soft); border-radius: var(--radius-md);
  padding: 18px 22px; margin-bottom: 26px;
}
.service-modal-price span { display: block; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 6px; }
.service-modal-price b { font-family: var(--font-heading); font-size: 19px; color: var(--brown-darker); }
.service-modal-close {
  position: absolute; top: 18px; right: 18px;
  width: 38px; height: 38px; border: none; border-radius: var(--radius-full);
  background: var(--cream-soft); color: var(--brown-dark);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background .25s ease;
}
.service-modal-close:hover { background: var(--sand-light); }
.service-modal-close svg { width: 17px; height: 17px; }
@keyframes smFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes smPop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@media (max-width: 560px) { .service-modal-box { padding: 38px 24px 28px; } }


/* ====== Карточки кранов компактнее: карточка + заголовок влезают в экран ноутбука ====== */
.crane-card .photo-placeholder { aspect-ratio: 2/1; }
.crane-card-body { padding: 18px 20px 20px; }
.crane-card-body h3 { font-size: clamp(17px, 1.5vw, 20px); margin-bottom: 4px; }
.crane-tag { font-size: 11.5px; padding: 5px 12px; }
.crane-specs { gap: 8px 14px; margin-block: 10px; padding-block: 10px; }
.crane-specs span { font-size: 11.5px; }
.crane-specs b { font-size: 13.5px; }
.crane-price { font-size: 17px; margin-bottom: 11px; }
.crane-card .btn-sm { padding: 11px 20px; font-size: 13px; }


/* ====== Карточки кранов: компактнее, фото крупнее относительно текста ====== */
.crane-card .photo-placeholder { aspect-ratio: 3/2; }
.crane-card-body { padding: 12px 15px 13px; }
.crane-card-body h3 { font-size: clamp(15.5px, 1.25vw, 17px); }
.crane-tag { font-size: 10.5px; padding: 4px 10px; }
.crane-specs { gap: 5px 12px; margin-block: 7px; padding-block: 7px; }
.crane-specs span { font-size: 10.5px; }
.crane-specs b { font-size: 12.5px; }
.crane-price { font-size: 15px; margin-bottom: 9px; }
.crane-card .btn-sm { padding: 9px 16px; font-size: 12px; }

/* ====== Кнопка в поп-апе — компактнее ====== */
.service-modal-box .btn { width: auto; display: inline-flex; padding: 13px 30px; font-size: 14px; }

/* ====== Принципы: увеличивается только наведённая карточка, низ не едет ====== */
.grid-4 { align-items: stretch; }
.value-card { min-height: 300px; }
.value-card p {
  max-height: none;
  opacity: 0;
  margin-top: 14px;
  transition: opacity .3s ease, transform .3s ease;
  transform: translateY(6px);
}
.value-card:hover p, .value-card:focus-within p { opacity: 1; transform: none; }


/* ====== Галерея «Наши будни» — плитка разного размера ====== */
.photo-mosaic { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 132px; gap: 22px; }
.photo-mosaic .photo-placeholder { height: 100%; aspect-ratio: auto; }
.photo-mosaic > *:nth-child(1) { grid-column: span 2; grid-row: span 2; }
.photo-mosaic > *:nth-child(2) { grid-column: span 4; grid-row: span 2; }
.photo-mosaic > *:nth-child(3) { grid-column: span 4; grid-row: span 2; }
.photo-mosaic > *:nth-child(4) { grid-column: span 2; grid-row: span 2; }

}


/* ====== Карточки кранов: ещё компактнее ====== */
.crane-card-body { padding: 10px 13px 12px; }
.crane-card-body h3 { font-size: clamp(14.5px, 1.15vw, 16px); }
.crane-tag { font-size: 10px; padding: 3px 9px; margin-bottom: 8px; }
.crane-specs { gap: 4px 10px; margin-block: 6px; padding-block: 6px; }
.crane-specs span { font-size: 10px; }
.crane-specs b { font-size: 12px; }
.crane-price { font-size: 14px; margin-bottom: 8px; }
.crane-card .btn-sm { padding: 8px 14px; font-size: 11.5px; }

/* ====== При наведении карточка не уходит под соседние блоки ====== */
.crane-rail { padding: 18px 14px 26px; }
.crane-card { position: relative; }
.crane-card:hover { z-index: 5; }
.grid-3 { position: relative; }

/* ====== Фильтры: две строки — по классу и по марке ====== */
.filter-group { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: -18px; margin-bottom: 28px; }
.filter-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.filter-row-label { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-light); margin-right: 4px; }

/* ====== CTA в подвале — квадратный блок слева ====== */
.footer-cta {
  background: linear-gradient(135deg, #8A5A34, #6B4426);
  border-radius: var(--radius-lg);
  padding: 20px 26px;
  display: flex; flex-direction: column; justify-content: center;
  gap: 10px;
  text-align: left;
}
.footer-cta h3 { color: var(--white); margin: 0; font-size: clamp(17px, 1.5vw, 21px); }
.footer-cta p { color: var(--yellow-soft); margin: 0; font-size: 13.5px; line-height: 1.5; }
.footer-cta .btn { align-self: flex-start; margin-top: 6px; padding: 11px 22px; font-size: 13.5px; }

/* сетка подвала: квадрат + текстовые колонки */
.footer-grid.footer-centered {
  grid-template-columns: minmax(0, 420px) minmax(0, 260px);
  justify-content: center;
  align-items: center;
  gap: 48px;
  text-align: left;
}
@media (max-width: 860px) {
  .footer-grid.footer-centered { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 32px; }
  .footer-cta { aspect-ratio: auto; width: 100%; max-width: 420px; text-align: center; align-items: center; }
  .footer-cta .btn { align-self: center; }
}

/* ====== Принципы: квадрат → прямоугольник при наведении, ничего не сдвигается ====== */
.grid-4 { padding-bottom: 76px; }
.value-slot { position: relative; height: 272px; }
.value-slot > .value-card {
  position: absolute; inset: 0 0 auto 0;
  min-height: 272px;
  overflow: hidden;
  transition: box-shadow .3s ease, transform .3s ease;
}
.value-slot > .value-card:hover, .value-slot > .value-card:focus-within { z-index: 6; box-shadow: var(--shadow-soft); }
.value-card p { opacity: 0; max-height: 0; margin-top: 0; transform: none;
  transition: opacity .28s ease, max-height .35s ease, margin-top .35s ease; }
.value-card:hover p, .value-card:focus-within p { opacity: 1; max-height: 180px; margin-top: 14px; }



/* ====== Страница заявки: только форма, компактнее ====== */
.request-layout { grid-template-columns: minmax(0, 520px); justify-content: center; }
.request-layout .contact-form { padding: 32px 30px 30px; }
.request-layout .form-group { margin-bottom: 16px; }
.request-layout .contact-form input,
.request-layout .contact-form textarea { padding: 13px 18px; font-size: 14.5px; }
.request-layout .contact-form textarea { min-height: 96px; }
.request-layout .contact-form h3 { font-size: clamp(19px, 1.9vw, 23px); margin-bottom: 20px; }


/* CTA в подвале — справа */
.footer-grid.footer-centered .footer-cta { order: 3; }

/* «Пунктуальность» — в одну строку */
.value-card h3 { font-size: clamp(16px, 1.35vw, 19px); white-space: nowrap; }



/* ====== Услуги: вертикальная лента с бегунком ====== */
.service-rail {
  max-width: 860px;
  margin-inline: auto;
  max-height: 460px;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 6px 16px 6px 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--sand-dark) transparent;
}
.service-rail::-webkit-scrollbar { width: 8px; }
.service-rail::-webkit-scrollbar-track { background: var(--sand-light); border-radius: var(--radius-full); }
.service-rail::-webkit-scrollbar-thumb { background: var(--sand-dark); border-radius: var(--radius-full); }
.service-rail::-webkit-scrollbar-thumb:hover { background: var(--tan); }

/* карточка-прямоугольник: значок | текст | цена */
.service-rail .service-card {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 22px 28px;
  flex-shrink: 0;
}
.service-rail .icon-badge { margin: 0; width: 58px; height: 58px; }
.service-rail .service-text { flex: 1; min-width: 0; }
.service-rail .service-text h3 { margin: 0 0 6px; padding-right: 0; font-size: clamp(17px, 1.6vw, 20px); }
.service-rail .service-text p { margin: 0; font-size: 14.5px; }
.service-rail .service-price {
  flex-shrink: 0;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 17px;
  color: var(--orange-dark);
  white-space: nowrap;
  text-align: right;
}
@media (max-width: 680px) {
  .service-rail .service-card { flex-wrap: wrap; gap: 14px; padding: 18px 20px; }
  .service-rail .service-price { width: 100%; text-align: left; }
}


/* ====== Страница заявки: фото на всю область под формой ====== */
.request-section { position: relative; overflow: hidden; min-height: calc(100vh - 59px); display: flex; align-items: center; }
.request-section .request-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border-radius: 0; border: none;
  align-items: flex-end; justify-content: flex-end;
  padding: 28px 34px;
  z-index: 0;
}
.request-section::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(251,245,234,.55), rgba(251,245,234,.35) 45%, rgba(251,245,234,.6));
  z-index: 1;
}
.request-section > .container { position: relative; z-index: 2; width: 100%; }


/* ============ 8) Услуги: видна одна услуга, остальные — прокруткой ============ */
/* видна ровно одна услуга: высота ленты = высота карточки + поля */
.service-rail { max-height: 146px; scroll-snap-type: y mandatory; padding-block: 0; }
.service-rail .service-card { scroll-snap-align: start; min-height: 128px; }
.service-rail .service-card { scroll-snap-align: start; }

/* ============ 1) Карточки кранов на мобильных — лентой вбок ============ */
@media (max-width: 860px) {
  .crane-grid {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 6px 4px 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--sand-dark) transparent;
  }
  .crane-grid > .crane-card { flex: 0 0 76%; scroll-snap-align: start; }
  .crane-grid::-webkit-scrollbar { height: 7px; }
  .crane-grid::-webkit-scrollbar-track { background: var(--sand-light); border-radius: var(--radius-full); }
  .crane-grid::-webkit-scrollbar-thumb { background: var(--sand-dark); border-radius: var(--radius-full); }
}

/* ============ 2) Мобильное меню: узкое, слева, подчёркивание по тексту ============ */
@media (max-width: 980px) {
  .main-nav { left: auto; right: 16px; width: max-content; min-width: 248px; max-width: calc(100vw - 32px); align-items: flex-start; }
  .main-nav a { width: auto; }
}

/* ============ 4) Отзывы: пропорции как на компьютере ============ */
@media (max-width: 860px) {
  .review-rail > * { flex: 0 0 min(360px, 88vw); }
}

/* ============ 5) «О компании»: фото перед текстом на мобильных ============ */
@media (max-width: 900px) {
  .split .split-media { order: -1; }
}

/* ============ 6) «Наши будни»: раскладка как на компьютере ============ */
@media (max-width: 860px) {
  .photo-mosaic { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 84px; gap: 12px; }
  .photo-mosaic > *:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .photo-mosaic > *:nth-child(2) { grid-column: span 4; grid-row: span 2; }
  .photo-mosaic > *:nth-child(3) { grid-column: span 4; grid-row: span 2; }
  .photo-mosaic > *:nth-child(4) { grid-column: span 2; grid-row: span 2; }
  .photo-mosaic .photo-placeholder span { font-size: 10.5px; }
}

@media (max-width: 860px) {
  .service-rail { max-height: 236px; }
  .service-rail .service-card { min-height: 220px; }
}


/* ====== Уходящие элементы лент уменьшаются при прокрутке ====== */
.crane-rail > .crane-card,
.crane-grid > .crane-card,
.service-rail > .service-card {
  transform-origin: center;
  transition: transform .18s linear, opacity .18s linear;
}
.crane-rail > .crane-card:hover { transition: transform .35s cubic-bezier(.34,1.16,.5,1), box-shadow .35s ease; }


/* Заголовки принципов — всегда в одну строку */
.value-card h3 { white-space: nowrap; }
@media (max-width: 1150px) { .value-card h3 { font-size: clamp(13px, 2.6vw, 17px); } }
@media (max-width: 420px)  { .value-card h3 { font-size: 12.5px; } }
.value-card { padding-inline: 14px; }


/* ====== Полоска контактов выезжает вправо, отодвигая телефон влево ====== */
.contact-dropdown {
  position: static;
  top: auto; right: auto;
  width: auto;
  max-height: none;
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  margin-left: 0;
  transition: max-width .38s cubic-bezier(.4, 0, .2, 1), margin-left .38s cubic-bezier(.4, 0, .2, 1), opacity .25s ease;
}
.contact-widget:hover .contact-dropdown,
.contact-widget:focus-within .contact-dropdown,
.contact-widget.open .contact-dropdown {
  max-width: 220px;
  margin-left: -44px;
  opacity: 1;
  pointer-events: auto;
}
.contact-dropdown-inner {
  flex-direction: row;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 50px;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, .62);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
}


/* На мобильных полоске не хватает ширины — ужимаем её только в самой шапке.
   Внутри выпадающего меню места достаточно, там полоска остаётся как на десктопе. */
@media (max-width: 980px) {
  .header-inner > .contact-widget .contact-dropdown-inner { gap: 2px; padding: 4px 8px 4px 46px; }
  .header-inner > .contact-widget.open .contact-dropdown,
  .header-inner > .contact-widget:focus-within .contact-dropdown { margin-left: -40px; }
  .header-inner > .contact-widget .contact-dropdown-item { width: 34px; height: 34px; }
  .header-inner > .contact-widget .contact-dropdown-item img { width: 19px; height: 19px; }
  .header-inner > .contact-widget .contact-dropdown-item.is-whatsapp img { width: 24px; height: 24px; }
  .header-inner > .contact-widget:hover .contact-dropdown,
  .header-inner > .contact-widget:focus-within .contact-dropdown,
  .header-inner > .contact-widget.open .contact-dropdown { max-width: 150px; }
  /* пока полоска открыта, логотип показывает только значок */
  .header-inner > .contact-widget.open ~ .logo { font-size: 0; }
}


/* кружок телефона — поверх полоски */
.contact-trigger { position: relative; z-index: 3; }


/* ====== Принципы: раскрытие по нажатию (мобильные) ====== */
.value-card.open p { opacity: 1; max-height: 180px; margin-top: 14px; }
.value-slot > .value-card.open { z-index: 6; box-shadow: var(--shadow-soft); }
@media (max-width: 860px) {
  /* карточка раскрывается поверх соседей: ячейка держит высоту, сетка не съезжает */
  .grid-4 { align-items: start; padding-bottom: 120px; }
  .value-slot { height: 208px; }
  .value-slot > .value-card {
    position: absolute; inset: 0 0 auto 0;
    min-height: 208px;
  }
  .value-card { cursor: pointer; }
}

/* ====== Телефон внутри выпадающего меню (мобильные) ====== */
@media (max-width: 980px) {
  .main-nav .contact-widget {
    margin: 10px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--sand-light);
    width: auto;
    align-self: stretch;
  }
  .main-nav .contact-widget .contact-dropdown-inner {
    background: var(--cream-soft); backdrop-filter: none; -webkit-backdrop-filter: none;
    gap: 6px; padding: 5px 10px 5px 50px;
  }
  .main-nav .contact-widget .contact-dropdown-item { width: 40px; height: 40px; }
  .main-nav .contact-widget .contact-dropdown-item img { width: 22px; height: 22px; }
  .main-nav .contact-widget .contact-dropdown-item.is-whatsapp img { width: 28px; height: 28px; }
  /* иконки внутри меню — не обычные пункты навигации: без подчёркивания и растяжки */
  .main-nav .contact-widget a { width: auto; padding: 0; }
  .main-nav .contact-widget a::after { content: none; }
  .main-nav .contact-widget .contact-trigger,
  .main-nav .contact-widget .contact-dropdown-item { width: 40px; height: 40px; padding: 0; }
  .main-nav .contact-widget.open .contact-dropdown,
  .main-nav .contact-widget:hover .contact-dropdown,
  .main-nav .contact-widget:focus-within .contact-dropdown { max-width: 220px; margin-left: -44px; }
}

/* ====== Кнопка «Фильтры» (мобильные) ====== */
.filters-toggle { display: none; }
@media (max-width: 860px) {
  .filters-toggle {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 0 auto 18px;
    padding: 13px 26px;
    border: none; cursor: pointer;
    background: var(--sand-light); color: var(--brown-dark);
    border-radius: var(--radius-full);
    font-weight: 700; font-size: 14px;
    transition: background .25s ease;
  }
  .filters-toggle svg { width: 17px; height: 17px; transition: transform .3s ease; }
  .filters-toggle.open svg { transform: rotate(180deg); }
  .filters-toggle:hover { background: var(--sand); }
  .filter-group {
    max-height: 0; overflow: hidden; opacity: 0;
    margin: 0; padding: 0;
    transition: max-height .35s ease, opacity .25s ease, margin .3s ease;
  }
  .filter-group.open { max-height: 460px; opacity: 1; margin-bottom: 24px; }
}


/* ====== Принципы на тач-устройствах: только клик, без «залипшего» наведения ====== */
@media (hover: none) {
  .value-card:hover, .value-card:focus-within {
    transform: none;
    box-shadow: var(--shadow-card);
  }
  .value-card:hover p, .value-card:focus-within p {
    max-height: 0; opacity: 0; margin-top: 0;
  }
  .value-card:hover .icon-badge, .value-card:focus-within .icon-badge { transform: none; }
  .value-slot > .value-card:hover, .value-slot > .value-card:focus-within {
    z-index: auto; box-shadow: var(--shadow-card);
  }
  /* раскрытие — только по классу .open, который ставит клик */
  .value-card.open p { max-height: 180px; opacity: 1; margin-top: 14px; }
  .value-slot > .value-card.open { z-index: 6; box-shadow: var(--shadow-soft); }
}


/* ====== Без «прыжка» шапки: до переноса виджета скриптом он не показывается ====== */
@media (max-width: 980px) {
  html.js .header-inner > .contact-widget { display: none; }
}

/* =================================================================
   Правки заказчика (СтройМеханизация)
   ================================================================= */

/* модели в карточке класса крана */
.crane-models { margin-block: 22px; padding-block: 22px; border-block: 1px solid var(--sand-light); }
.crane-models-label { font-size: 12.5px; color: var(--ink-light); display: block; }
.crane-models .tag-row { margin-top: 12px; gap: 8px; }
.crane-models .mini-tag { font-family: var(--font-heading); font-weight: 700; font-size: 12.5px; padding: 8px 14px; color: var(--brown-darker); }
.crane-grid .crane-card-body { display: flex; flex-direction: column; }
.crane-grid .crane-models { flex: 1; }

/* что входит в цену */
.price-includes { margin-top: 48px; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 36px 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px 56px; align-items: center; }
.price-includes h3 { font-size: 20px; margin-bottom: 20px; }
.price-includes .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
.price-includes .checklist li { margin-bottom: 10px; font-size: 15px; }
.price-includes-note { background: var(--cream-soft); border-radius: var(--radius-md); padding: 24px 28px; font-size: 15px; color: var(--ink); }
.price-includes-note b { color: var(--brown-darker); }
@media (max-width: 860px) { .price-includes { grid-template-columns: 1fr; padding: 30px 26px; } }
@media (max-width: 420px) { .price-includes .checklist { grid-template-columns: 1fr; } }

/* преимущества пневмоколёсных кранов */
.adv-card { padding: 34px 32px; }
.adv-card h3 { font-size: 19px; margin-bottom: 10px; }
.adv-card p { font-size: 15px; }

/* партнёры */
.partner-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 960px; margin-inline: auto; }
.partner-card { background: var(--white); border: 2px solid var(--sand-light); border-radius: var(--radius-md); padding: 26px 20px; text-align: center; font-family: var(--font-heading); font-weight: 700; font-size: 17px; color: var(--brown-darker); }
@media (max-width: 720px) { .partner-grid { grid-template-columns: 1fr 1fr; gap: 14px; } .partner-card { font-size: 15px; padding: 20px 12px; } }

/* офис и база на карте */
.location-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 28px; display: flex; flex-direction: column; gap: 22px; }
.location-head { display: flex; gap: 18px; align-items: center; }
.location-head .icon-badge { margin-bottom: 0; }
.location-head h3 { font-size: 20px; margin-bottom: 4px; }
.location-head p { font-size: 15px; color: var(--ink); }
.map-frame { border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 4/3; background: var(--cream-soft); }
.map-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 860px) { .location-grid { grid-template-columns: 1fr; } }

/* адреса в футере */
.footer-grid.footer-centered { grid-template-columns: minmax(0, 420px) minmax(0, 340px); }
.footer-address { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.footer-address li { color: #D9C6AE; font-size: 14px; line-height: 1.5; }
.footer-address b { color: var(--white); font-weight: 600; }
@media (max-width: 720px) { .footer-grid.footer-centered { grid-template-columns: 1fr; } }

/* длинное слово «пневмоколёсные» в главном заголовке */
.crane-grid .crane-tag { align-self: flex-start; }

/* =================================================================
   Правки v2
   ================================================================= */

/* плашка с тоннами — на фото, в верхнем левом углу */
.crane-card .photo-placeholder { position: relative; }
.crane-card .photo-placeholder .crane-tag { position: absolute; top: 14px; left: 14px; margin: 0; max-width: none; font-size: 11.5px; font-weight: 700; color: var(--brown-dark); padding: 5px 12px; line-height: 1.4; box-shadow: 0 6px 14px -8px rgba(62,40,20,.35); }
.crane-card-body h3 { margin-bottom: 8px; }

/* карточки уже */
.crane-rail > .crane-card { flex: 0 0 clamp(210px, 22%, 250px); }

/* главная: одна карточка, слева кнопка «Все краны» */
.crane-showcase { display: flex; align-items: center; justify-content: center; gap: 40px; }
.crane-showcase .crane-card { width: 250px; flex: none; }
@media (max-width: 560px) { .crane-showcase { flex-direction: column-reverse; gap: 28px; } }

/* преимущества: фото на весь блок, маленькие плитки, описание в поп-апе */
.adv-section { overflow: hidden; }
.adv-bg { position: absolute; inset: 0; border-radius: 0; border: none; min-height: 0; z-index: 0; justify-content: flex-end; padding-bottom: 24px; }
.adv-section > .container { position: relative; z-index: 1; }
.adv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 920px; margin-inline: auto; }
.adv-tile { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; background: rgba(255,255,255,.94); border: none; border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .3s cubic-bezier(.34,1.2,.5,1), box-shadow .3s ease; }
.adv-tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-soft); }
.adv-tile .icon-badge { width: 48px; height: 48px; margin: 0; }
.adv-tile .icon-badge svg { width: 23px; height: 23px; }
.adv-tile-title { flex: 1; font-family: var(--font-heading); font-weight: 700; font-size: 15.5px; color: var(--brown-darker); line-height: 1.35; }
.adv-tile-more { width: 30px; height: 30px; flex-shrink: 0; border-radius: var(--radius-full); background: var(--sand-light); color: var(--orange-dark); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; line-height: 1; transition: background .25s ease, color .25s ease; }
.adv-tile:hover .adv-tile-more { background: var(--orange); color: var(--white); }
@media (max-width: 860px) { .adv-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .adv-grid { grid-template-columns: 1fr; } }

/* пустые слоты отзывов */
.review-empty .review-name, .review-empty .review-role, .review-empty p { color: var(--placeholder-text); }

/* партнёры — бегущая строка слева направо */
.partner-marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); padding-block: 6px; }
.partner-track { display: flex; width: max-content; animation: partnersRun 30s linear infinite; }
.partner-marquee:hover .partner-track { animation-play-state: paused; }
.partner-group { display: flex; gap: 20px; padding-right: 20px; }
.partner-group .partner-card { flex: none; white-space: nowrap; padding: 22px 40px; }
@keyframes partnersRun { from { transform: translateX(-50%); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .partner-track { animation-duration: 90s; } }

/* =================================================================
   Правки v3: одна карта с двумя метками, адрес в футере в одну строку
   ================================================================= */
.location-single { gap: 26px; }
.location-points { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; }
.location-point { display: flex; gap: 16px; align-items: flex-start; }
.location-point h3 { font-size: 20px; margin-bottom: 4px; }
.location-point p { font-size: 15px; color: var(--ink); }
.map-pin { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--white); font-family: var(--font-heading); font-weight: 700; font-size: 16px; box-shadow: 0 6px 14px -6px rgba(62,40,20,.45); }
.pin-office { background: #F28B30; }
.pin-base { background: #1E5BA8; }
.location-link { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--orange-dark); }
.location-link:hover { color: var(--brown-darker); }
.map-wide { aspect-ratio: 16/7; }
@media (max-width: 760px) {
  .location-points { grid-template-columns: 1fr; }
  .map-wide { aspect-ratio: 4/5; }
}

.footer-grid.footer-centered { grid-template-columns: minmax(0, 500px) minmax(0, 300px); }
@media (min-width: 721px) { .footer-address li { white-space: nowrap; } }
@media (max-width: 720px) { .footer-grid.footer-centered { grid-template-columns: 1fr; } }
/* на телефоне: подпись над адресом, сам адрес — одной строкой */
@media (max-width: 720px) {
  .footer-address b { display: block; }
  .footer-address li { font-size: 13px; white-space: nowrap; }
}
/* длинное название в шапке не выталкивает меню на узких телефонах */
@media (max-width: 400px) { .logo { font-size: 17px; gap: 10px; } .header-inner { gap: 14px; } }

/* Фото в первом экране */
.hero-visual .hero-photo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: 72% 55%;
  z-index: 0;
}
.hero-visual:has(.hero-photo)::after {
  background:
    linear-gradient(90deg, rgba(251,245,234,.88) 0%, rgba(251,245,234,.72) 32%, rgba(251,245,234,.15) 58%, rgba(251,245,234,0) 72%),
    linear-gradient(180deg, rgba(251,245,234,0) 70%, var(--cream) 100%);
}

/* Реальные фото вместо заглушек */
.adv-section .adv-photo { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.adv-section:has(.adv-photo)::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 60% 70% at 50% 55%, rgba(251,245,234,.55), rgba(251,245,234,.12) 75%);
}
.about-photo { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.photo-mosaic .mosaic-photo { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-lg); }
.photo-mosaic .mosaic-photo[src*="contract-signing"] { object-position: 40% center; }
.photo-mosaic .mosaic-photo[src*="operator-cab"] { object-position: 60% center; }
.photo-mosaic .mosaic-photo[src*="team"] { object-position: center 30%; }

/* Фото кранов в карточках */
.crane-card .crane-photo { position: relative; padding: 0; background: #fff; overflow: hidden; }
.crane-card .crane-photo img { display: block; width: 100%; height: 100%; object-fit: contain; transition: transform .4s ease; }

/* ===== Правки v5 ===== */
/* стрелочки в плитках преимуществ */
.adv-tile-more svg { width: 15px; height: 15px; }
.adv-tile:hover .adv-tile-more { transform: translateX(3px); }
.adv-tile-more { transition: transform .25s ease, background .25s ease; }

/* фильтры: заливка ровно по форме кнопки, без обрезков рамки */
.filter-tag { border: none; box-shadow: inset 0 0 0 2px var(--sand-light); padding: 16px 30px; background-clip: padding-box; }
.filter-tag.active { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--white); box-shadow: none; }
@media (hover: hover) {
  .filter-tag:hover:not(.active) { background: var(--sand-light); color: var(--brown-dark); box-shadow: inset 0 0 0 2px var(--sand-light); }
}
@media (hover: none) {
  .filter-tag:hover:not(.active) { background: var(--white); color: var(--brown-dark); box-shadow: inset 0 0 0 2px var(--sand-light); }
}
/* в телефоне кнопки фильтров меньше */
@media (max-width: 720px) {
  .filter-row { gap: 8px; }
  .filter-tag { padding: 9px 15px; font-size: 12.5px; }
  .filter-row-label { font-size: 11px; width: 100%; text-align: center; margin: 4px 0 0; }
}

/* карточка крана целиком увеличивается и всплывает поверх соседей */
.crane-rail > .crane-card,
.crane-grid > .crane-card,
.crane-showcase .crane-card { position: relative; transform: scale(calc(var(--rail-scale, 1) * var(--hover-scale, 1))); }
@media (hover: hover) {
  .crane-card:hover { --hover-scale: 1.05; z-index: 20; }
}
.crane-rail { padding: 22px 16px 30px; }
.crane-card .crane-photo img { transform: none !important; }

/* всплывающий выбор номера / почты */
.cpop {
  position: fixed; z-index: 1000; min-width: 210px;
  background: var(--white); border-radius: 18px; padding: 8px;
  box-shadow: 0 18px 40px -12px rgba(62,40,20,.35), 0 0 0 1px rgba(62,40,20,.06);
  animation: cpopIn .18s ease;
}
.cpop[hidden] { display: none; }
@keyframes cpopIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.cpop-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-light); padding: 6px 12px 4px; }
.cpop a { display: block; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--brown-dark); white-space: nowrap; transition: background .2s ease; }
.cpop a:hover, .cpop a:focus-visible { background: var(--sand-light); }
.crane-rail > .crane-card:hover,
.crane-grid > .crane-card:hover,
.crane-showcase .crane-card:hover { transform: scale(calc(var(--rail-scale, 1) * var(--hover-scale, 1))); }
.service-rail > *, .review-rail > * { transform: scale(var(--rail-scale, 1)); }

/* ===== Правки v6 ===== */
/* 1) фото первого экрана плавно растворяется в фоне сайта */
.hero-visual .hero-photo {
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 55%, rgba(0,0,0,.35) 80%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 0%, #000 55%, rgba(0,0,0,.35) 80%, transparent 100%);
}
.hero-visual:has(.hero-photo) { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.hero-visual:has(.hero-photo)::after {
  background:
    linear-gradient(90deg, rgba(251,245,234,.88) 0%, rgba(251,245,234,.72) 32%, rgba(251,245,234,.15) 58%, rgba(251,245,234,0) 72%),
    linear-gradient(180deg, rgba(251,245,234,0) 55%, var(--cream) 100%);
}
/* 13) в телефоне фото тоже за заголовком */
@media (max-width: 900px) {
  .hero-visual .hero-photo { object-position: 70% 100%; }
  .hero-visual:has(.hero-photo)::after {
    background: linear-gradient(180deg, rgba(251,245,234,.92) 0%, rgba(251,245,234,.84) 45%, rgba(251,245,234,.5) 72%, rgba(251,245,234,.2) 86%, var(--cream) 100%);
  }
  .hero-visual:has(.hero-photo) .hero-text { padding-bottom: 150px; }
}

/* 2) три крана на главной, в телефоне — один */
.crane-showcase { flex-direction: column; gap: 36px; }
.showcase-cards { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; padding: 10px; }
.showcase-cards .crane-card { width: 270px; flex: none; }
@media (max-width: 720px) {
  .showcase-extra { display: none !important; }
  .crane-showcase { flex-direction: column; }
}

/* 5–6) блок преимуществ: фото без белых полос и с мягкими краями */
.adv-section { background: var(--cream-soft); }
.adv-section .adv-photo {
  padding: 0; inset: 0; height: 100%;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
}
@media (max-width: 900px) {
  .hero-visual .hero-photo {
    object-position: 74% 100%;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 84%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 84%, transparent 100%);
  }
  .hero-visual:has(.hero-photo)::after {
    background: linear-gradient(180deg, rgba(251,245,234,.93) 0%, rgba(251,245,234,.86) 50%, rgba(251,245,234,.55) 62%, rgba(251,245,234,0) 74%, rgba(251,245,234,0) 88%, var(--cream) 100%);
  }
  .hero-visual:has(.hero-photo) .hero-text { padding-bottom: 260px; }

/* ===== Правки v7 ===== */
/* тени карточек компактнее — не обрезаются краем ленты */
.crane-card, .review-rail > .review-card { box-shadow: 0 8px 18px -10px rgba(62, 40, 20, 0.22); }
.crane-card:hover, .crane-rail > .crane-card:hover { box-shadow: 0 12px 22px -12px rgba(62, 40, 20, 0.3); }

/* отзывы листаются так же, как карточки кранов */

.review-rail > .review-card,
.review-rail > .review-card.reveal,
.review-rail > .review-card.reveal.is-visible {
  transform: scale(var(--rail-scale, 1));
  transform-origin: center;
  transition: transform .18s linear, opacity .18s linear;
}

/* ===== Правки v8 ===== */
/* выпадающий список: всегда вниз, со стрелочкой к значку */
.cpop { animation: cpopIn .18s ease; }
.cpop::before {
  content: ""; position: absolute; top: -7px; left: var(--arrow-x, 50%);
  width: 16px; height: 16px; margin-left: -8px; border-radius: 3px 0 0 0;
  transform: rotate(45deg);
  background: linear-gradient(135deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.9) 35%, #fff 60%);
}
.site-footer { padding-bottom: 130px; }

/* первый экран: цвет сайта только под текстом, справа — чистое фото */
@media (min-width: 901px) {
  .hero-visual .hero-photo {
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 72%, rgba(0,0,0,.5) 88%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 72%, rgba(0,0,0,.5) 88%, transparent 100%);
  }
  .hero-visual:has(.hero-photo)::after {
    background:
      linear-gradient(90deg, rgba(251,245,234,.9) 0%, rgba(251,245,234,.78) 30%, rgba(251,245,234,.35) 44%, rgba(251,245,234,0) 54%),
      linear-gradient(180deg, rgba(251,245,234,0) 78%, var(--cream) 100%);
  }
}

/* отзывы: две карточки по центру */
.review-rail { justify-content: safe center; }

/* список услуг: компактная тень, не обрезается */
.service-rail { padding: 10px 18px 16px 10px; }
.service-rail .service-card { box-shadow: 0 8px 18px -10px rgba(62, 40, 20, 0.22); }

/* карта с цветными метками */
.map-canvas { width: 100%; height: 100%; z-index: 0; background: var(--cream-soft); }
.map-marker { background: none; border: none; }
.map-marker-pin {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 3px solid #fff; box-shadow: 0 6px 14px -4px rgba(0,0,0,.4);
}
.map-marker-pin b { transform: rotate(45deg); color: #fff; font: 700 16px/1 var(--font-heading); }
.map-marker-pin.pin-office { background: #F28B30; }
.map-marker-pin.pin-base { background: #1E5BA8; }
.leaflet-popup-content { font: 14px/1.5 var(--font-body, sans-serif); color: var(--ink); }
.leaflet-popup-content a { color: var(--orange); font-weight: 700; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink-light); }

/* фон страницы заявки — фото с главной */
.request-section .request-photo { padding: 0; object-fit: cover; object-position: 70% 40%; }
.request-section:has(.request-photo)::after {
  background: linear-gradient(90deg, rgba(251,245,234,.35), rgba(251,245,234,.15) 50%, rgba(251,245,234,0));
}
@media (max-width: 720px) {
  .request-section:has(.request-photo)::after { background: rgba(251,245,234,.25); }
}
/* страница заявки без подвала: ровно на высоту экрана */
body:has(.request-section) { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
body:has(.request-section) > main { flex: 1; display: flex; }
body:has(.request-section) .request-section { flex: 1; min-height: 0; }
</style>
