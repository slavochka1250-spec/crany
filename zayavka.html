<main>

  <section class="section request-section" style="padding-top:56px;">
    <img class="request-bg request-photo" src="images/arenda-pnevmokolesnogo-krana-moskva.webp" srcset="images/arenda-pnevmokolesnogo-krana-moskva-960.webp 960w, images/arenda-pnevmokolesnogo-krana-moskva.webp 1920w" sizes="100vw" alt="" aria-hidden="true" width="1920" height="1080" decoding="async">
    <div class="container">
      <div class="request-layout">

        <div class="contact-form reveal">
          <h1 class="form-title" style="margin-bottom:28px;">Оставить заявку</h1>
          <form class="js-contact-form" id="requestForm">
            <div class="form-group">
              <label for="name">Ваше имя</label>
              <input type="text" id="name" name="name" placeholder="Как к вам обращаться" required>
            </div>
            <div class="form-group">
              <label for="phone">Телефон</label>
              <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" inputmode="tel" autocomplete="tel" maxlength="18" pattern="\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}" title="Введите номер полностью: +7 (999) 123-45-67" required>
            </div>
            <div class="form-group">
              <label for="comment">Какая задача?</label>
              <textarea id="comment" name="comment" placeholder="Опишите, какой кран нужен и на какой срок"></textarea>
            </div>
            <div class="hp-field" aria-hidden="true">
              <label for="website">Сайт</label>
              <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Отправить заявку</button>
            <p class="form-note" id="formError" style="color:#c0392b;display:none;"></p>
            <p class="form-note">Нажимая кнопку, вы соглашаетесь с политикой обработки персональных данных</p>
          </form>
          <div class="form-success" id="formSuccess">
            <div class="icon-badge" style="width:72px;height:72px;margin:0 auto 20px;">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h3>Заявка отправлена!</h3>
          </div>

          <script>
          (function () {
            // Заявка уходит письмом на почту через сервис FormSubmit (formsubmit.co).
            var EMAIL = 'slavochka.ushakov.08@mail.ru';  // временно; потом вернуть stroimontage@mail.ru   // письма отправляет сервис FormSubmit (formsubmit.co)

            var form = document.getElementById('requestForm');
            var btn  = document.getElementById('submitBtn');
            var err  = document.getElementById('formError');
            var ok   = document.getElementById('formSuccess');

            var toEmail = function (name, phone, comment) {
              return fetch('https://formsubmit.co/ajax/' + EMAIL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                  _subject: 'Новая заявка с сайта — ' + name,
                  _template: 'table',
                  _captcha: 'false',
                  _honey: form.querySelector('[name=website]').value,
                  'Имя': name,
                  'Телефон': phone,
                  'Задача': comment || '—'
                })
              }).then(function (r) { return r.json(); })
                .then(function (d) { if (String(d.success) !== 'true') throw new Error(d.message || 'Email error'); });
            };

            var startedAt = Date.now();
            var showErr = function (msg) {
              err.textContent = msg; err.style.display = 'block';
              btn.disabled = false; btn.textContent = 'Отправить заявку';
            };

            form.addEventListener('submit', function (e) {
              e.preventDefault();
              err.style.display = 'none';
              btn.disabled = true;
              btn.textContent = 'Отправляем…';

              var name    = form.querySelector('[name=name]').value.trim();
              var phone   = form.querySelector('[name=phone]').value.trim();
              var comment = form.querySelector('[name=comment]').value.trim();

              // --- защита от спама ---
              var fakeOk = function () { form.style.display = 'none'; ok.classList.add('show'); };
              // 1) скрытое поле: человек его не видит, а бот заполняет
              if (form.querySelector('[name=website]').value) return fakeOk();
              // 2) слишком быстро: человек не заполнит форму за 3 секунды
              if (Date.now() - startedAt < 3000) return fakeOk();
              // 3) явно выдуманные номера: 0000000000, 1111111111, 1234567890 и т. п.
              var d = phone.replace(/\D/g, '').slice(1);
              if (/^(\d)\1{9}$/.test(d) || d === '1234567890' || d === '9876543210' || /^[0-1]/.test(d)) {
                return showErr('Проверьте номер телефона — похоже, в нём ошибка.');
              }
              // 4) не чаще одной заявки в минуту с одного устройства
              try {
                var last = +localStorage.getItem('lastRequestAt') || 0;
                if (Date.now() - last < 60000) return showErr('Заявка уже отправлена. Если нужно что-то добавить — позвоните нам: +7 (916) 804-28-24');
              } catch (x) {}

              toEmail(name, phone, comment).then(function () {
                try { localStorage.setItem('lastRequestAt', Date.now()); } catch (x) {}
                form.style.display = 'none';
                ok.classList.add('show');
              }).catch(function (ex) {
                console.error(ex);
                err.textContent = 'Не удалось отправить заявку. Позвоните нам: +7 (916) 804-28-24';
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Отправить заявку';
              });
            });
          })();
          </script>
        </div>

      </div>
    </div>
  </section>
